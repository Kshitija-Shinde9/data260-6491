<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Grocery Recall Notices{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Pages can add their own stylesheet here. It loads after Bootstrap, so a page
       that brings its own styles wins where the two overlap. The dashboard uses this
       to pull in the HW2 stylesheet unchanged. -->
  {% block head %}{% endblock %}
</head>
<body class="bg-body-tertiary d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="/">
      Grocery Recall Notices
      <span class="badge text-bg-light ms-2 fw-normal">port 8191</span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navLinks" aria-controls="navLinks"
            aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-end" id="navLinks">
      <div class="navbar-nav">
        {% if user %}
          <span class="navbar-text text-white-50 me-3 small">
            Signed in as {{ user.name }}
          </span>
          <a class="nav-link {% if active == 'dashboard' %}active fw-semibold{% endif %}"
             href="/dashboard">Dashboard</a>
          <a class="nav-link" href="/logout">Logout</a>
        {% else %}
          <a class="nav-link {% if active == 'login' %}active fw-semibold{% endif %}"
             href="/login">Login</a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>

<main class="container py-4 flex-grow-1">
  {% block content %}{% endblock %}
</main>

<footer class="container py-4 text-center text-body-secondary small">
  DATA-260 HW3 &middot; SID4 6491 &middot; DOMAIN_ID 3 &mdash; Grocery supply and recall notices
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
